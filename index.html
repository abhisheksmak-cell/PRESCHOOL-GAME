<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Early Learning Sandbox</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #E6E6FA 100%);
            --primary-dark: #3A3A4F;
        }
        body {
            margin: 0; padding: 0; background: var(--bg-gradient);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            text-align: center; color: var(--primary-dark); user-select: none;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }
        .screen { display: none; min-height: 100vh; flex-direction: column; justify-content: space-between; align-items: center; box-sizing: border-box; padding: 30px 20px; }
        .active { display: flex; }
        
        /* Typography & Header UI */
        h1 { font-size: 36px; margin: 10px 0; text-shadow: 2px 2px 0px white; color: #4A4A6A; font-weight: 900; }
        .subtitle { font-size: 16px; color: #7A7A9A; margin-top: -10px; margin-bottom: 30px; font-weight: bold; }
        
        /* Menu Buttons */
        .btn-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; margin: auto 0; }
        .menu-btn {
            width: 90%; max-width: 440px; background: white; border: none; padding: 22px;
            border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(160,160,190,0.15); display: flex; align-items: center;
            border: 3px solid transparent; transition: all 0.2s ease;
        }
        .menu-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(160,160,190,0.1); }
        .menu-btn.blue { border-color: #BAEDFF; }
        .menu-btn.orange { border-color: #FFE0B2; }
        .circle-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; margin-right: 20px; }

        /* Game 1: Size Logic UI */
        .score-board { font-size: 26px; font-weight: 900; background: white; padding: 12px 30px; border-radius: 50px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .arena { display: flex; justify-content: space-around; align-items: center; width: 100%; max-width: 600px; margin: auto 0; height: 300px; }
        .item-card {
            background: white; border-radius: 40px; padding: 25px; cursor: pointer;
            box-shadow: 0 12px 24px rgba(0,0,0,0.06); border: 5px solid #F0F0FB;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s ease;
        }
        
        /* Game 2: Premium Phonics Card UI */
        .phonics-card {
            width: 85%; max-width: 340px; height: 440px; background: white; border-radius: 45px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; margin: auto 0;
            border: 6px solid white; transition: transform 0.2s ease;
        }
        .phonics-card:active { transform: scale(0.97); }
        .char-display { font-size: 110px; font-weight: 900; margin: 0; line-height: 1.1; color: #2D2D44; }
        .emoji-display { font-size: 90px; margin: 15px 0; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }
        .word-display { font-size: 26px; font-weight: 800; color: #5C5C7A; letter-spacing: 0.5px; }
        
        /* Navigation Controls */
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 20px; width: 100%; }
        .nav-circle {
            width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 28px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); background: white; transition: transform 0.1s;
        }
        .nav-circle:active { transform: scale(0.9); }
        .back-home-btn { background: #FFCCD2; border: none; padding: 14px 35px; font-size: 18px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }

        /* Full Screen Overlay Notifications */
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.92); justify-content: center; align-items: center; z-index: 100; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SCREEN 1: MAIN ENTRY HOME HUB -->
    <div id="hub-screen" class="screen active">
        <div>
            <h1>Kids Learning App ✨</h1>
            <div class="subtitle">Fun Activities for Pre-KG</div>
        </div>
        
        <div class="btn-container">
            <button class="menu-btn orange" onclick="startSizeGame()">
                <div class="circle-icon" style="background:#FFE0B2">🦁</div>
                <div style="text-align:left;">Which is Bigger?<br><span style="font-size:13px; color:#9A9A9A; font-weight:normal;">Compare sizes & targets</span></div>
            </button>
            <button class="menu-btn blue" onclick="startPhonics('en')">
                <div class="circle-icon" style="background:#B3E5FC">🍎</div>
                <div style="text-align:left;">English Phonics<br><span style="font-size:13px; color:#9A9A9A; font-weight:normal;">A to Z Sound Adventure</span></div>
            </button>
            <button class="menu-btn blue" onclick="startPhonics('hi')">
                <div class="circle-icon" style="background:#C8E6C9">🍇</div>
                <div style="text-align:left;">Hindi Phonics (स्वर)<br><span style="font-size:13px; color:#9A9A9A; font-weight:normal;">अ से अः वर्णमाला ज्ञान</span></div>
            </button>
        </div>
        <div></div>
    </div>

    <!-- SCREEN 2: DYNAMIC SIZE LOGIC GAME -->
    <div id="size-screen" class="screen">
        <div class="score-board">Stars Collected: ⭐ <span id="star-count">0</span></div>
        <div class="arena">
            <div id="left-item" class="item-card" onclick="processSizeChoice(true)"></div>
            <div id="right-item" class="item-card" onclick="processSizeChoice(false)"></div>
        </div>
        <h2 style="color: #5C5C7A; font-weight: 800;">Tap the larger object!</h2>
        <button class="back-home-btn" onclick="exitToHub()">Back to Menu</button>
    </div>

    <!-- SCREEN 3: PHONICS EDUCATION STATION -->
    <div id="phonics-screen" class="screen">
        <h1 id="phonics-title">English Alphabets</h1>
        <div id="flash-card" class="phonics-card" onclick="playVoicePrompt()">
            <span id="card-letter" class="char-display">A</span>
            <span id="card-emoji" class="emoji-display">🍎</span>
            <span id="card-word" class="word-display">Tap Card to Hear</span>
        </div>
        <div class="controls-row">
            <button class="nav-circle" onclick="shiftCard(-1)">⬅️</button>
            <button class="nav-circle" onclick="shiftCard(1)">➡️</button>
        </div>
        <button class="back-home-btn" onclick="exitToHub()">Back to Menu</button>
    </div>

    <!-- REWARD OVERLAY BOX -->
    <div id="reward-popup" class="popup">
        <span style="font-size:100px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));">🌟</span>
        <h1 style="color: #4CAF50; font-size: 40px; margin-top:20px;">Superb! Done!</h1>
    </div>

    <script>
        let currentPoints = 0;
        let leftDimension, rightDimension, isLeftTargetBigger;
        let currentLanguageMode = 'en';
        let customPhonicsIndex = 0;

        const assetList = ["🍎","🦁","🚗","🧸","🦆","🍦","🏀","🐱","🐶","🐘","🦉","🌈","🚀","🍉"];

        const alphaEnglish = [
            {l:"A", w:"Apple", e:"🍎", c:"#FFCDD2"}, {l:"B", w:"Ball", e:"🏀", c:"#BBDEFB"},
            {l:"C", w:"Cat", e:"🐱", c:"#E8F5E9"}, {l:"D", w:"Dog", e:"🐶", c:"#FFF9C4"},
            {l:"E", w:"Elephant", e:"🐘", c:"#E1BEE7"}, {l:"F", w:"Fish", e:"🐟", c:"#FFE0B2"},
            {l:"G", w:"Grapes", e:"🍇", c:"#C8E6C9"}, {l:"H", w:"Hat", e:"🎩", c:"#D1C4E9"},
            {l:"I", w:"Ice Cream", e:"🍦", c:"#FFECB3"}, {l:"J", w:"Juice", e:"🧃", c:"#E1BEE7"},
            {l:"K", w:"Kite", e:"🪁", c:"#FFE0B2"}, {l:"L", w:"Lion", e:"🦁", c:"#FFCDD2"},
            {l:"M", w:"Monkey", e:"🐒", c:"#C8E6C9"}, {l:"N", w:"Nest", e:"🪹", c:"#B3E5FC"},
            {l:"O", w:"Orange", e:"🍊", c:"#FFE0B2"}, {l:"P", w:"Parrot", e:"🦜", c:"#E8F5E9"},
            {l:"Q", w:"Queen", e:"👸", c:"#D1C4E9"}, {l:"R", w:"Rabbit", e:"🐇", c:"#FFCDD2"},
            {l:"S", w:"Sun", e:"☀️", c:"#FFF9C4"}, {l:"T", w:"Train", e:"🚂", c:"#B3E5FC"},
            {l:"U", w:"Umbrella", e:"☂️", c:"#E1BEE7"}, {l:"V", w:"Van", e:"🚐", c:"#FFE0B2"},
            {l:"W", w:"Watch", e:"⌚", c:"#C8E6C9"}, {l:"X", w:"Xylophone", e:"🎼", c:"#FFECB3"},
            {l:"Y", w:"Yo-Yo", e:"🪀", c:"#FFCDD2"}, {l:"Z", w:"Zebra", e:"🦓", c:"#E8F5E9"}
        ];

        const alphaHindi = [
            {l:"अ", w:"अनार (Anar)", e:"🫘", c:"#FFCDD2", s:"अ से अनार"},
            {l:"आ", w:"आम (Aam)", e:"🥭", c:"#FFE0B2", s:"आ से आम"},
            {l:"इ", w:"इमली (Imli)", e:"🪵", c:"#FFF9C4", s:"इ से इमली"},
            {l:"ई", w:"ईख (Eekh)", e:"🌾", c:"#E8F5E9", s:"ई से ईख"},
            {l:"उ", w:"उल्लू (Ullu)", e:"🦉", c:"#B3E5FC", s:"उ से उल्लू"},
            {l:"ऊ", w:"ऊन (Oon)", e:"🧶", c:"#D1C4E9", s:"ऊ से ऊन"},
            {l:"ऋ", w:"ऋषि (Rishi)", e:"🧘", c:"#E1BEE7", s:"ऋ से ऋषि"},
            {l:"ए", w:"एड़ी (Edee)", e:"🦶", c:"#FFECB3", s:"ए से एड़ी"},
            {l:"ऐ", w:"ऐनक (Ainak)", e:"👓", c:"#F5F5F5", s:"ऐ से ऐनक"},
            {l:"ओ", w:"ओखली (Okhli)", e:"🥣", c:"#FFE0B2", s:"ओ से ओखली"},
